  <script type="module">const STORES = [
  {id_tienda:'T01',nombre_tienda:'Bogotá Centro',ciudad:'Bogotá',region:'Centro'},
  {id_tienda:'T02',nombre_tienda:'Medellín Norte',ciudad:'Medellín',region:'Antioquia'},
  {id_tienda:'T03',nombre_tienda:'Cali Sur',ciudad:'Cali',region:'Pacífico'},
  {id_tienda:'T04',nombre_tienda:'Barranquilla Mar',ciudad:'Barranquilla',region:'Caribe'}
];
const PRODUCTS = [
  {id_producto:'P01',nombre_producto:'Audífonos',categoria:'Tecnología'},
  {id_producto:'P02',nombre_producto:'Teclado',categoria:'tecnologia'},
  {id_producto:'P03',nombre_producto:'Mouse',categoria:'TECNOLOGÍA'},
  {id_producto:'P04',nombre_producto:'Lámpara',categoria:'Hogar'},
  {id_producto:'P05',nombre_producto:'Organizador',categoria:' hogar '},
  {id_producto:'P06',nombre_producto:'Botella',categoria:'Bienestar'},
  {id_producto:'P07',nombre_producto:'Colchoneta',categoria:'bienestar'},
  {id_producto:'P08',nombre_producto:'Libreta',categoria:'Papelería'}
];
const prices=[95000,160000,65000,120000,45000,38000,85000,22000];
const clone = value => JSON.parse(JSON.stringify(value));
function createDataset(){
  const pedidos=Array.from({length:240},(_,i)=>{
    const s=i%4,p=(i*7+Math.floor(i/11))%8;
    return {id_pedido:`N${String(i+1).padStart(4,'0')}`,fecha:`2026-${String(1+Math.floor(i/40)).padStart(2,'0')}-${String(1+i%27).padStart(2,'0')}`,id_tienda:STORES[s].id_tienda,id_producto:PRODUCTS[p].id_producto,cantidad:1+((i*13)%5),precio_unitario:prices[p],descuento:0.04+((i*7)%9)*0.015};
  });
  pedidos[2]={...pedidos[1],id_pedido:'N0003'};
  pedidos[12].cantidad=null;
  [20,61,102,143].forEach(i=>{const [y,m,d]=pedidos[i].fecha.split('-');pedidos[i].fecha=`${d}/${m}/${y}`;});
  pedidos[48].cantidad=999;
  pedidos.splice(8,0,clone(pedidos[7]));
  const devoluciones=Array.from({length:22},(_,i)=>({id_devolucion:`D${String(i+1).padStart(3,'0')}`,id_pedido:`N${String(5+i*9).padStart(4,'0')}`,cantidad_devuelta:1,motivo:['Cambio de talla','Defecto','No solicitado','Error de entrega'][i%4],valor_devuelto:Math.round((i+1)*18000)}));
  return {Pedidos:pedidos,Productos:clone(PRODUCTS),Tiendas:clone(STORES),Devoluciones:devoluciones};
}
const ORIGINAL=createDataset();
const RECEIPTS={N0013:4,N0049:9};
const METRICS={
  neto:{label:'Ingresos netos',unit:'COP',formula:'Σ cantidad × precio_unitario × (1 − descuento)'},
  bruto:{label:'Ingresos brutos',unit:'COP',formula:'Σ cantidad × precio_unitario'},
  descuentos:{label:'Descuentos',unit:'COP',formula:'Σ cantidad × precio_unitario × descuento'},
  cantidad:{label:'Unidades vendidas',unit:'unidades',formula:'Σ cantidad'},
  pedidos:{label:'Pedidos',unit:'pedidos',formula:'Número de pedidos válidos'},
  devueltas:{label:'Unidades devueltas',unit:'unidades',formula:'Σ cantidad_devuelta; vínculo por id_pedido'}
};
function normalizeCategory(s){const v=String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return {tecnologia:'Tecnología',hogar:'Hogar',bienestar:'Bienestar',papeleria:'Papelería'}[v] ?? v.charAt(0).toUpperCase()+v.slice(1);} 
function diagnose(data){
  const seen=new Set();let duplicates=0;
  for(const r of data.Pedidos){if(seen.has(r.id_pedido))duplicates++;seen.add(r.id_pedido);}
  return {duplicates,missing:data.Pedidos.filter(r=>r.cantidad===null).length,dates:data.Pedidos.filter(r=>!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(r.fecha)).length,categories:data.Productos.filter(r=>r.categoria!==normalizeCategory(r.categoria)).length};
}
const TRANSFORMS={
  duplicates:{title:'Verificar duplicado por ID',description:'Conservar una copia del pedido N0008, idéntico en todos sus campos. N0002 y N0003 se conservan: tienen IDs distintos.',key:'duplicate'},
  missing:{title:'Recuperar el valor faltante',description:'El comprobante sintético de N0013 confirma 4 unidades. Recuperar por ID; no sustituir todos los faltantes por cero.',key:'missing'},
  dates:{title:'Unificar fechas',description:'Las cuatro fechas DD/MM/AAAA se interpretan según la convención documentada del archivo y se convierten a AAAA-MM-DD.',key:'dates'},
  categories:{title:'Normalizar categorías',description:'Aplicar el catálogo aprobado: Tecnología, Hogar, Bienestar y Papelería. Se modifican etiquetas, no ventas.',key:'categories'},
  outliers:{title:'Contrastar el valor atípico',description:'N0049 tiene 999 unidades. El comprobante sintético confirma 9: corregir con evidencia, conservando el registro.',key:'outliers'}
};
function transform(data,type){
  if(!TRANSFORMS[type])throw new Error('Transformación desconocida');
  const next=clone(data),changes=[];
  if(type==='duplicates'){
    const seen=new Map();next.Pedidos=next.Pedidos.filter(r=>{const old=seen.get(r.id_pedido);if(old&&JSON.stringify(old)===JSON.stringify(r)){changes.push({id:r.id_pedido,antes:'2 copias idénticas',despues:'Se conserva 1 registro'});return false;}seen.set(r.id_pedido,r);return true;});
  }
  if(type==='missing'||type==='outliers')for(const r of next.Pedidos){if((type==='missing'&&r.cantidad===null)||(type==='outliers'&&r.cantidad>100)){const n=RECEIPTS[r.id_pedido];if(n!==undefined){changes.push({id:r.id_pedido,antes:r.cantidad,despues:n});r.cantidad=n;}}}
  if(type==='dates')for(const r of next.Pedidos){if(/^\d{2}\/\d{2}\/\d{4}$/.test(r.fecha)){const [d,m,y]=r.fecha.split('/');changes.push({id:r.id_pedido,antes:r.fecha,despues:`${y}-${m}-${d}`});r.fecha=`${y}-${m}-${d}`;}}
  if(type==='categories')for(const r of next.Productos){const n=normalizeCategory(r.categoria);if(n!==r.categoria){changes.push({id:r.id_producto,antes:r.categoria,despues:n});r.categoria=n;}}
  return {data:next,changes};
}
const totalIssues = data => Object.values(diagnose(data)).reduce((a,b)=>a+b,0);
function calculate(data,{metric='neto',dimension='tienda',operation='suma'}={}){
  const groups=new Map();let excluded=0;
  const returns=new Map();for(const r of data.Devoluciones)returns.set(r.id_pedido,(returns.get(r.id_pedido)||0)+r.cantidad_devuelta);
  for(const r of data.Pedidos){
    if(r.cantidad===null||r.cantidad===undefined||r.cantidad<0){excluded++;continue;}
    const key = data.Tiendas.find(t=>t.id_tienda===r.id_tienda)?.[dimension] || r[dimension] || 'Sin dimensión';
    const product = data.Productos.find(p=>p.id_producto===r.id_producto);
    const quantity = Number(r.cantidad) || 0;
    const base = quantity * Number(r.precio_unitario || 0);
    const desc = base * Number(r.descuento || 0);
    const net = base - desc;
    const entry = groups.get(key) || {bruto:0,neto:0,descuentos:0,cantidad:0,pedidos:0,devueltas:0};
    entry.bruto += base;
    entry.neto += net;
    entry.descuentos += desc;
    entry.cantidad += quantity;
    entry.pedidos += 1;
    entry.devueltas += returns.get(r.id_pedido) || 0;
    groups.set(key,entry);
  }
  const values = [...groups.entries()].map(([label,values])=>({label,...values}));
  return {values,excluded,metric};
}

if(app){app.innerHTML = '<div class="shell">...</div>'};
